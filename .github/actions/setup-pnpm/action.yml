name: Set up Node and pnpm
description: Use the workspace's pinned pnpm version and cache its content-addressable store.
inputs:
  directory:
    description: Workspace directory containing package.json and pnpm-lock.yaml.
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Enable the pinned pnpm version
      id: pnpm
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        corepack enable pnpm
        pnpm --version
        store="$(pnpm store path --silent)"
        printf 'store=%s\n' "$store" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: node24-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.directory)) }}
